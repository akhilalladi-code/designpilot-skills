name: Deploy DesignPilot website

on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - ".github/workflows/deploy-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Validate website files
        run: |
          test -s site/index.html
          test -s site/robots.txt
          test -s site/sitemap.xml
          test -s site/llms.txt
          grep -q 'rel="canonical"' site/index.html
          grep -q 'application/ld+json' site/index.html
          grep -q 'Sitemap:' site/robots.txt
          grep -q 'https://akhilalladi-code.github.io/designpilot-skills/' site/sitemap.xml
          echo "Website SEO files validated."

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload website artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
